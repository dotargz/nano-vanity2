[package]
name = "nano-vanity2"
version = "0.1.0"
edition = "2021"
description = "Extremely fast vanity address generator for the Nano cryptocurrency"
license = "MIT"
build = "build.rs"

[dependencies]
regex = "1.11"
regex-syntax = "0.8"
getrandom = "0.3"
zeroize = "1.8"
libloading = "0.8"

[build-dependencies]
cc = "1"

[dev-dependencies]
curve25519-dalek = "4"
blake2 = "0.10"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# The build script generates the embedded lookup table; give it some speed.
[profile.release.build-override]
opt-level = 2
[profile.dev.build-override]
opt-level = 2
